PUBLIC_ADDITIONAL_ORIGINS = "https://crossingriver.love"
ACCESS_TEAM_DOMAIN = "red-cloud-5baa.cloudflareaccess.com"
ACCESS_AUD = "284503c52c7f6954a2f632284b521fa6ecd3cb35566e1ecc8797a0f181c4312a"
ADMIN_EMAILS = "1084459061@qq.com"
IMAGEKIT_PUBLIC_KEY = "public_6VL1OXPWDFt1XaEzcVPveC8/cK0="
IMAGEKIT_URL_ENDPOINT = "https://ik.imagekit.io/floristld"
